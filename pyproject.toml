[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsaiec-mi-eeg"
version = "1.0.0"
description = "Complete reproduction pipeline for the WS-AIEC motor-imagery EEG study"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "Hossein Ahmadi", email = "hossein.ahmadi@polito.it"},
  {name = "Luca Mesin"},
]
keywords = ["EEG", "BCI", "motor imagery", "CSP", "stacking", "ensemble", "WS-AIEC", "MOABB"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.5,<1.8",
  "mne>=1.8,<1.12",
  "moabb==1.5.0",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
  "torch==2.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
wsaiec-eeg = "wsaiec_eeg.cli:main"

[project.urls]
Article = "https://doi.org/10.1109/ACCESS.2024.3434654"
Repository = "https://github.com/HosseinAhmadi63/WS-AIEC-MI-EEG-Classification"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wsaiec_eeg = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
